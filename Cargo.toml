[package]
name = "thefuzz-parity"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Justin Jones <hey.jones@icloud.com>"]
license = "MIT"
description = "Unicode fuzzy scoring and ranked choice extraction. Not affiliated with SeatGeek or the thefuzz maintainers. Parity is a tested claim against thefuzz 0.22.1."
keywords = ["fuzzy", "fuzzywuzzy", "similarity", "search", "unicode"]
categories = ["algorithms", "text-processing"]
readme = "README.md"
repository = "https://github.com/hey-jj/thefuzz-parity"
documentation = "https://docs.rs/thefuzz-parity"
exclude = [".github/**", "fuzz/**", "reviews/**", "tools/**"]

[dependencies]

[dev-dependencies]
proptest = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
